<html>

<head>
    <title>Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu&display=swap" rel="stylesheet">
    <link href="styles/index.css" rel="stylesheet" />
    <link href="styles/detail.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <header>
            <div class="logoClass">
                <img src='assests/images/logo.png' alt='logo' id="logo">
            </div>
            <div class="loginClass">
                <a href="./login.html">Login</a>
            </div>
        </header>
        <div class="content">
            <img src='https://media-cdn.tripadvisor.com/media/photo-w/17/b3/09/b4/by-the-poolside.jpg' class="hotelImg">
            <div class='bookingForm'>
                <form action="./payment.html">
                    <label> Adults:</label>
                    <input type="number" id="adults" name="adults" min=1 required>
                    <br />
                    <label>Name:</label>
                    <input type="text" id="Name" name="Name">
                    <br />
                    <label> From Date:</label>
                    <input type="date" id="fromDate" name="fromDate" required>
                    <br />
                    <label> To Date:</label>
                    <input type="date" id="toDate" name="toDate" required>
                    <br />
                    <label>Total:</label>
                    <input type="text" id="price" name="price" value="" readonly><br />
                    <button type="submit">
                        Book Now
                    </button>
                </form>
            </div>
            <div class='hotelDescription'>
                <h2>Radisson Blu Hotel</h2>
                <p>RATING</p>
                <p>5 star</p>
                <p>AMENITIES</p>
                <ul>
                    <li>Room Service</li>
                    <li>Resturant</li>
                    <li>Business center</li>
                    <li>Fitness center</li>
                    <li>Pool</li>
                </ul>
                <h5>DESCRIPTION</h5>
                <p>Lorem ipsum dolor sit amet consectetur</p>
            </div>
        </div>
        <footer>
            <div class="topFooter">
                <div class="leftFooter">
                    <a href="./contact.html">Contact Us</a>
                </div>
                <div class="rightFooter">
                    <a href="https://facebook.com" target="_blank"><img
                            src="assests/images/facebook.png" class="social"></a>
                    <a href="https://instagram.com" target="_blank"><img src="assests/images/instagram.png"
                            class="social"></a>
                    <a href="https://twitter.com" target="_blank"><img src="assests/images/twitter.png"
                            class="social"></a>
                </div>
            </div>

            <div class="copyright">
                &copy 2020 ROOM SEARCH PVT LTD
            </div>
        </footer>
    </div>
</body>

</html>
