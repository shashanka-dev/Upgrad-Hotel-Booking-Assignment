<html>

<head>
    <title>List</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu&display=swap" rel="stylesheet">
    <link href="styles/index.css" rel="stylesheet" />
    <link href="styles/list.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <header>
            <div class="logoClass">
                <img src='assests/images/logo.png' alt='logo' id="logo">
            </div>
            <div class="loginClass">
                <a href="./login.html">Login</a>
            </div>
        </header>
        <div class="content">
            <div class="viewstyle">
                <div class="listview"><a href="#list-view">List View</a></div>
                <div class="mapview"><a href="#map-view">Map View</a></div>
            </div>
            <div class='hotel-list' id="list-view">
                <div class='hotel-card'>
                    <a href='./detail.html'>
                        <img src='https://media-cdn.tripadvisor.com/media/photo-w/17/b3/09/b4/by-the-poolside.jpg'>
                        <h3>Radisson Blu Hotel</h3>
                        <p>5 star</p>
                        <p>New Delhi</p>
                    </a>
                </div>
                <div class='hotel-card'>
                    <img src='https://media-cdn.tripadvisor.com/media/photo-w/15/06/31/5f/facade.jpg'>
                    <h3>The Lalit New Delhi</h3>
                    <p>4.5 star</p>
                    <p>New Delhi</p>
                </div>
                <div class='hotel-card'>
                    <img src='https://media-cdn.tripadvisor.com/media/photo-w/1b/4e/9b/11/exterior.jpg'>
                    <h3>Taj Palace</h3>
                    <p>4 star</p>
                    <p>New Delhi</p>
                </div>
            </div>
            <div id="map-view">
                <img src='https://cdn.pixabay.com/photo/2018/01/31/05/43/web-3120321_960_720.png'>
                <p>Map View</p>
            </div>
        </div>
        <footer>
            <div class="topFooter">
                <div class="leftFooter">
                    <a href="./contact.html">Contact Us</a>
                </div>
                <div class="rightFooter">
                    <a href="https://facebook.com" target="_blank"><img
                            src="assests/images/facebook.png" class="social"></a>
                    <a href="https://instagram.com" target="_blank"><img src="assests/images/instagram.png"
                            class="social"></a>
                    <a href="https://twitter.com" target="_blank"><img src="assests/images/twitter.png"
                            class="social"></a>
                </div>
            </div>

            <div class="copyright">
                &copy 2020 ROOM SEARCH PVT LTD
            </div>
        </footer>
    </div>
</body>

</html>
